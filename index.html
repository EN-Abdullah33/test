<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المنيو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a237e;--navy2:#0d47a1;--teal:#1fb5a8;--green:#2e7d32;--red:#e53935;--muted:#6b7a99;--line:#cfe3f3;--adminH:0px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;color:#1b2a4a;min-height:100vh;
  background:linear-gradient(180deg,#bfe3fa 0%,#eaf6fd 40%,#fdf6e3 85%,#f6e7c1 100%) fixed}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:10px 14px;border:2px solid var(--line);border-radius:12px;outline:none;background:#fff;color:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
.hidden{display:none!important}
.btn{border:none;border-radius:12px;padding:10px 20px;font-weight:700;color:#fff;background:var(--navy);transition:.2s}
.btn:hover{filter:brightness(1.15)}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.teal{background:var(--teal)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.sm{padding:5px 12px;font-size:.85rem;border-radius:9px}
 
/* شريط المدير */
.adminbar{position:sticky;top:0;z-index:60;height:46px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.adminbar::-webkit-scrollbar{display:none}
.adminbar b{flex:0 0 auto}
.adminbar .sp{flex:1}
.adminbar button{background:#ffffff26;border:none;color:#fff;padding:6px 12px;border-radius:9px;font-weight:600;font-size:.85rem;flex:0 0 auto}
 
/* 1) البحث + المدير */
.topbar{max-width:1100px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:10px}
.search{flex:1;max-width:460px;position:relative}
.search input{padding-right:42px;border-radius:30px;box-shadow:0 3px 12px #1a237e18}
.search span{position:absolute;right:15px;top:50%;transform:translateY(-50%)}
.topbar .sp{flex:1}
.mgr{width:44px;height:44px;border-radius:50%;border:2px solid var(--navy);background:#fff;font-size:1.3rem;box-shadow:0 3px 12px #1a237e22}
 
/* 2) اللوقو */
.logo-box{max-width:1100px;margin:0 auto;padding:6px 14px;text-align:center}
.logo-box img{display:block;margin:0 auto;max-width:100%;height:auto}
.tools{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:8px 0}
.tools button,.tools label{background:#fff;border:2px solid var(--navy);color:var(--navy);border-radius:30px;padding:5px 14px;font-weight:700;font-size:.85rem;display:flex;align-items:center;gap:8px}
.tools input[type=range]{width:130px;padding:0;border:none}
.tpl{display:block;width:100%;text-align:center;border:3px dashed var(--teal);background:#ffffff90;color:var(--navy);padding:28px 14px;border-radius:20px;font-weight:700;font-size:1.05rem;line-height:1.9}
.tpl small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.tpl:hover{background:#fff}
 
.wave{height:28px;max-width:700px;margin:4px auto;color:var(--navy2);opacity:.85}
.wave svg{width:100%;height:100%;display:block}
 
/* 3) الأقسام */
.cats{position:sticky;top:var(--adminH);z-index:40;background:#ffffffee;backdrop-filter:blur(8px);box-shadow:0 4px 16px #1a237e1c;
  padding:10px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:6px 0}
.cats::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--navy);color:var(--navy);background:#fff;padding:6px 18px;border-radius:30px;font-weight:700;white-space:nowrap;transition:.2s}
.chip.on,.chip:hover{background:var(--navy);color:#fff}
.chip.add{border-style:dashed;border-color:var(--teal);color:var(--teal)}
 
/* 4) العروض المتحركة */
#offersBox{max-width:1100px;margin:6px auto;padding:0 14px}
.offers{direction:ltr;overflow:hidden;padding:22px 0;border-radius:24px;background:#ffffff55;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;width:max-content;animation:slide var(--dur,40s) linear infinite;will-change:transform}
@keyframes slide{to{transform:translateX(calc(var(--dist,0px) * -1))}}
.ocard{flex:0 0 auto;margin-right:16px;animation:bob 3.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes bob{0%,100%{transform:translateY(-12px)}50%{transform:translateY(12px)}}
.ocard img{display:block;height:var(--h,180px);width:auto;max-width:none;border-radius:18px;box-shadow:0 8px 20px #1a237e30}
 
/* 5) الأصناف */
main{max-width:1100px;margin:0 auto;padding:10px 14px 20px}
#menu{scroll-margin-top:calc(var(--adminH) + 70px)}
.sec{margin-bottom:26px;scroll-margin-top:calc(var(--adminH) + 70px)}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-head h2{color:var(--navy);font-size:1.5rem;font-weight:900;display:flex;align-items:center;gap:8px}
.sec-tools{display:flex;gap:5px;flex-wrap:wrap}
.sec-tools button{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:9px;padding:3px 10px;font-weight:700;font-size:.8rem}
.sec-box{border:2px solid #ffffff;background:#ffffff66;border-radius:22px;padding:14px;box-shadow:0 6px 22px #1a237e14}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px 8px 12px;text-align:center;transition:.25s;box-shadow:0 4px 14px #1a237e12}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #1a237e25}
.card .pic{position:relative;border-radius:13px;overflow:hidden;background:linear-gradient(135deg,#d3f0ec,#f6e7c1);display:flex;align-items:center;justify-content:center}
.card .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.noimg{font-size:2.2rem;color:var(--navy);opacity:.6;font-weight:700}
.nm{font-weight:900;color:var(--navy);margin-top:8px;font-size:1.05rem}
.ds{font-size:.8rem;color:var(--muted);margin-top:2px}
.pr{font-weight:900;color:var(--green);margin-top:4px}
.pr small{color:var(--muted);font-weight:600}
.bdg{position:absolute;top:14px;left:14px;font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:20px;z-index:2}
.bdg.star{background:#ffe08a;color:#7a5a00}.bdg.off{background:var(--red);color:#fff}
.card.sold{opacity:.55;filter:grayscale(.6)}
.itools{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:8px}
.itools button{border:2px solid var(--navy);background:#fff;border-radius:9px;padding:2px 9px}
.card-add{min-height:150px;padding:14px;font-size:.95rem}
.ghosty{border-style:dashed;border-color:var(--teal);opacity:.8}
.ghosty .pic{height:140px}
.empty{text-align:center;color:var(--muted);padding:50px 10px;font-size:1.2rem}
 
/* التعليقات */
.comments{max-width:700px;margin:10px auto 0;padding:0 14px 30px}
.comments h2{color:var(--navy);margin-bottom:10px}
.cform{display:flex;flex-direction:column;gap:8px;background:#fff;border-radius:20px;padding:14px;box-shadow:0 6px 22px #1a237e18}
.clist{margin-top:14px}
.cmt{background:#fff;border-radius:14px;padding:10px 14px;margin-bottom:8px;border-right:4px solid var(--teal);display:flex;gap:10px;align-items:flex-start}
.cmt .tx{flex:1}.cmt small{color:var(--muted)}
footer{text-align:center;padding:22px 14px;color:var(--navy);font-weight:700}
 
/* نافذة */
#modal{position:fixed;inset:0;background:#0b1b4a99;z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.m{background:#fff;border-radius:22px;padding:20px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.m h2{color:var(--navy);margin-bottom:6px}
.m label{display:block;font-weight:700;font-size:.9rem;margin:10px 0 4px;color:var(--navy)}
.macts{display:flex;gap:8px;margin-top:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chk{display:flex!important;align-items:center;gap:8px}.chk input{width:auto}
.mpic{border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#d3f0ec,#f6e7c1);display:flex;align-items:center;justify-content:center;margin-top:6px;border:2px dashed var(--teal)}
.mpic img{width:100%;height:100%;object-fit:cover}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.thumbs .th{position:relative;border-radius:12px;overflow:hidden;height:80px;background:#eee}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:4px;left:4px;border:none;background:var(--red);color:#fff;border-radius:50%;width:24px;height:24px}
.err{color:var(--red);font-weight:700;margin-top:8px}
.note{font-size:.8rem;color:var(--muted);margin-top:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 22px;border-radius:30px;font-weight:700;z-index:200;box-shadow:0 6px 20px #0004}
/* السلة */
.addcart{margin-top:8px;width:100%;border:none;background:var(--teal);color:#fff;border-radius:12px;padding:7px;font-weight:700}
.addcart:hover{filter:brightness(1.1)}
.cartbtn{position:fixed;bottom:18px;left:16px;right:16px;max-width:420px;margin:0 auto;z-index:80;border:none;background:var(--green);color:#fff;border-radius:40px;padding:13px 22px;font-weight:900;font-size:1rem;box-shadow:0 8px 24px #0005}
.crow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.crow .cn{flex:1;min-width:0}.crow .cn b,.crow .cn small{display:block}.crow small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px;font-weight:900}
.qty button{width:30px;height:30px;border-radius:50%;border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:900;font-size:1.1rem;line-height:1}
.ctot{margin-top:10px;font-size:1.1rem;color:var(--navy);text-align:center}
.delnote{background:#fff4d6;border:2px solid #f5c542;color:#7a5a00;border-radius:12px;padding:8px 12px;margin-top:10px;font-weight:700;font-size:.9rem}
.toast{bottom:84px}
footer{padding-bottom:90px}
/* ===== تخطيطات عرض الأصناف ===== */
.grid.g1{grid-template-columns:1fr}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.grid.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.grid.big .pic{height:230px!important}
.grid.list,.grid.mini{grid-template-columns:1fr}
.grid.list2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.list .card,.grid.list2 .card,.grid.mini .card{display:flex;align-items:center;gap:12px;text-align:right}
.grid.list .pic,.grid.list2 .pic{flex:0 0 120px;width:120px;height:100%!important}
.grid.mini .pic{flex:0 0 56px;width:56px;height:56px!important}
.grid.mini .card{padding:6px 8px}
.grid.mini .ds{display:none}
.cinfo{min-width:0}
.grid.list .cinfo,.grid.list2 .cinfo,.grid.mini .cinfo{flex:1}
.grid.list .nm,.grid.list2 .nm,.grid.mini .nm{margin-top:0}
.grid.list .addcart,.grid.list2 .addcart,.grid.mini .addcart{width:auto;padding:5px 16px}
.grid.list .itools,.grid.list2 .itools,.grid.mini .itools{justify-content:flex-start}
.grid.g3 .pic,.grid.g4 .pic,.grid.g5 .pic,.grid.g6 .pic{height:auto!important;aspect-ratio:1}
.grid.g3 .card,.grid.g4 .card{padding:6px 6px 10px}
.grid.g6 .card{padding:4px 4px 8px}
.grid.g3 .ds,.grid.g4 .ds{font-size:.72rem}
.grid.g4 .nm{font-size:.92rem}
.grid.g5 .nm,.grid.g6 .nm{font-size:.8rem}
.grid.g5 .ds,.grid.g6 .ds{display:none}
.grid.g5 .addcart,.grid.g6 .addcart{font-size:.7rem;padding:5px 2px}
@media(max-width:820px){.grid.g5,.grid.g6{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:520px){
  .grid.g4,.grid.g5,.grid.g6{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid.g3 .nm,.grid.g4 .nm,.grid.g5 .nm,.grid.g6 .nm{font-size:.76rem}
  .grid.g3 .ds,.grid.g4 .ds{display:none}
  .grid.g3 .pr,.grid.g4 .pr,.grid.g5 .pr,.grid.g6 .pr{font-size:.8rem}
  .grid.g3 .addcart,.grid.g4 .addcart{font-size:.68rem;padding:5px 2px}
  .grid.list2,.grid.big{grid-template-columns:1fr}
}
/* ===== أشكال الصور ===== */
.shape-square .card .pic{border-radius:0}
.shape-squircle .card .pic{border-radius:30%;aspect-ratio:1;height:auto!important}
.shape-circle .card .pic{border-radius:50%;aspect-ratio:1;height:auto!important}
.shape-oval .card .pic{border-radius:50%}
.shape-arch .card .pic{border-radius:999px 999px 14px 14px}
.shape-hexagon .card .pic{clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);border-radius:0;aspect-ratio:1;height:auto!important}
.shape-diamond .card .pic{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border-radius:0;aspect-ratio:1;height:auto!important}
.shape-blob .card .pic{border-radius:63% 37% 54% 46%/55% 48% 52% 45%;aspect-ratio:1;height:auto!important}
.shape-wide .card .pic{aspect-ratio:16/9;height:auto!important}
.shape-tall .card .pic{aspect-ratio:3/4;height:auto!important}
/* نافذة التنسيق */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 4px;font-weight:700;font-size:.78rem;color:var(--navy)}
.opt.on{border-color:var(--teal);background:#e6f7f5;box-shadow:0 0 0 2px #1fb5a855}
.mg{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:2px;width:44px}
.mg i{display:block;aspect-ratio:1;background:var(--navy);opacity:.75;border-radius:2px}
.mg.bar i{aspect-ratio:auto;height:7px}
.shp{display:block;width:34px;height:34px;background:linear-gradient(135deg,var(--teal),var(--navy))}
.sh-rounded{border-radius:9px}.sh-square{border-radius:0}.sh-squircle{border-radius:30%}.sh-circle{border-radius:50%}
.sh-oval{width:44px;height:28px;border-radius:50%}.sh-arch{border-radius:99px 99px 5px 5px}
.sh-hexagon{clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.sh-diamond{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.sh-blob{border-radius:63% 37% 54% 46%/55% 48% 52% 45%}
.sh-wide{width:46px;height:26px;border-radius:5px}.sh-tall{width:26px;height:34px;border-radius:5px}
/* ===== قوالب المناسبات ===== */
.banners{max-width:1100px;margin:8px auto;padding:0 14px;display:flex;flex-direction:column;gap:12px}
.evb{position:relative;overflow:hidden;border-radius:24px;padding:26px 20px;text-align:center;color:#fff;background:linear-gradient(120deg,var(--c1),var(--c2));box-shadow:0 10px 28px #0003}
.evb::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,#ffffff40 50%,transparent 70%);transform:translateX(-120%);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{to{transform:translateX(120%)}}
.evt{position:relative;z-index:2}
.evt h3{font-size:1.7rem;font-weight:900;text-shadow:0 2px 8px #0005;margin:6px 0}
.evt p{font-size:1rem;opacity:.96;text-shadow:0 1px 4px #0004}
.evt small{display:block;margin-top:8px;font-weight:700}
.evbadge{display:inline-block;background:#fff;color:var(--c1);font-weight:900;padding:3px 16px;border-radius:30px;font-size:.9rem}
.evbadge.disc{background:#ffeb3b;color:#000;margin-right:6px;}
.fl{position:absolute;font-size:2.4rem;opacity:.35;animation:flo 5s ease-in-out infinite;z-index:1}
.f1{top:8%;right:6%}.f2{bottom:8%;left:8%;animation-delay:-1.5s}.f3{top:14%;left:22%;font-size:1.6rem;animation-delay:-3s}.f4{bottom:12%;right:24%;font-size:1.8rem;animation-delay:-2.2s}
@keyframes flo{0%,100%{transform:translateY(-8px) rotate(-6deg)}50%{transform:translateY(8px) rotate(6deg)}}
.evtools{position:absolute;top:8px;left:8px;z-index:3;display:flex;gap:6px}
.evtools button{border:none;background:#ffffffdd;border-radius:9px;padding:4px 9px}
.evg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.evtile{border:none;border-radius:16px;padding:14px 6px;color:#fff;font-weight:900;background:linear-gradient(120deg,var(--c1),var(--c2));display:flex;flex-direction:column;align-items:center;gap:6px;text-shadow:0 1px 4px #0004}
.evtile span{font-size:1.8rem}
#bPrev{margin-bottom:6px}
@media(max-width:520px){.evt h3{font-size:1.35rem}}
/* ===== آراء العملاء المتحركة ===== */
.cmtbox{max-width:1100px;margin:10px auto 0;padding:0 14px}
.cmtbox h2{color:var(--navy);text-align:center;margin-bottom:4px}
.ccard{width:260px;background:#fff;border-radius:20px;padding:12px 16px;box-shadow:0 8px 20px #1a237e24;direction:rtl;text-align:right;border-top:4px solid var(--teal)}
.ccard .cq{color:var(--teal);font-size:1.7rem;line-height:.7;font-weight:900}
.ccard p{margin:6px 0 8px;font-size:.92rem;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.ccard b{color:var(--navy);font-size:.85rem}
/* التواصل الاجتماعي */
.social{max-width:700px;margin:6px auto;padding:0 14px 10px;text-align:center}
.social h2{color:var(--navy);margin-bottom:10px}
.soc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.socbtn{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--navy);color:var(--navy);border-radius:30px;padding:8px 18px;font-weight:700;text-decoration:none;box-shadow:0 4px 12px #1a237e18}
.socbtn:hover{background:var(--navy);color:#fff}
</style>
</head>
<body>
 
<div id="adminBar" class="adminbar hidden">
  <b>🛠️ وضع المدير</b><span class="sp"></span>
  <button id="addCatBtn">➕ أقسام</button><button id="styleBtn">🎨 التنسيق</button><button id="evBtn">🎉 المناسبات</button><button id="pvBtn"></button><button id="setBtn">⚙️ الإعدادات</button><button id="outBtn">🚪 خروج</button>
</div>
 
<!-- خانة البحث (يمين) + خانة المدير (يسار) -->
<div class="topbar">
  <div class="search"><span>🔍</span><input id="q" type="search" placeholder="ابحث في المنيو..."></div>
  <span class="sp"></span>
  <button class="mgr" id="mgrBtn" title="دخول المدير">👤</button>
</div>
 
<!-- مساحة صورة اللوقو -->
<section id="logoBox" class="logo-box"></section>
<div class="wave" id="wv1"></div>
 
<!-- خانة الأقسام -->
<nav id="cats" class="cats"></nav>
 
<!-- مساحة صور العروض -->
<!-- قوالب المناسبات -->
<section id="banners" class="banners hidden"></section>
<section id="offersBox"></section>
<div class="wave" id="wv2"></div>
 
<!-- الأقسام والأصناف -->
<main id="menu"></main>
<div class="wave" id="wv3"></div>
 
<!-- التعليقات -->
<section id="cmtBox" class="cmtbox hidden"></section>
<section id="comments" class="comments"></section>
 
<!-- حسابات التواصل الاجتماعي -->
<section id="social" class="social"></section>
<button id="cartBtn" class="cartbtn hidden"></button>
<footer id="foot"></footer>
 
<div id="modal" class="hidden"></div>
<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="jsonPick" accept=".json,application/json" hidden>
 
<script>
/* ================= إعدادات الأمان وحماية المدير المدمجة (مع تخزين كلمة المرور محلياً لتغييرها) ================= */
const SECURE_CRED = {
  emHash: "b2NlYW5zaWRlLm5rQGdtYWlsLmNvbQ==", // Oceanside.nk@gmail.com (Base64)
  get email() { return atob(this.emHash); },
  getStoredPw() {

function readImage(file,max){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{
      const src=r.result;
      if(/gif|svg/.test(file.type))return res(src);
      const im=new Image();
      im.onload=()=>{
        const s=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        const alpha=/png|webp|avif/.test(file.type);
        let out=alpha?c.toDataURL('image/webp',.88):c.toDataURL('image/jpeg',.88);
        if(alpha&&!out.startsWith('data:image/webp'))out=c.toDataURL('image/png');
        res(out);
      };
      im.onerror=()=>res(src);
      im.src=src;
    };
    r.readAsDataURL(file);
  });
}

/* ================= السلة وإرسال الطلب لواتساب ================= */
const CARTK='os_cart_v1';
let cart=[];try{cart=JSON.parse(localStorage.getItem(CARTK))||[]}catch(e){}
const saveCart=()=>{try{localStorage.setItem(CARTK,JSON.stringify(cart))}catch(e){}};
const AR_D='٠١٢٣٤٥٦٧٨٩';
function normPhone(v){
  let d=String(v||'').replace(/[٠-٩]/g,x=>AR_D.indexOf(x)).replace(/\D/g,'');
  if(d.startsWith('00'))d=d.slice(2);
  if(d.startsWith('0'))d='966'+d.slice(1);
  else if(/^5\d{8}$/.test(d))d='966'+d;
  return d.length>=10&&d.length<=15?d:'';
}
const priceNum=v=>{const n=parseFloat(String(v??'').replace(/[٠-٩]/g,x=>AR_D.indexOf(x)).replace(/[,،]/g,''));return isNaN(n)?null:n};
const fmt=n=>String(Math.round(n*100)/100);
function cartLines(){return cart.map(c=>({it:data.items.find(x=>x.id===c.id),q:c.q})).filter(l=>l.it&&l.it.available!==false&&l.q>0)}
function cartTotals(){
  let total=0,noPrice=false,count=0;
  cartLines().forEach(l=>{count+=l.q;const p=priceNum(l.it.price);if(p==null)noPrice=true;else total+=p*l.q});
  return{total,noPrice,count};
}
function addToCart(id){
  const c=cart.find(x=>x.id===id);if(c)c.q++;else cart.push({id,q:1});
  saveCart();renderCartBtn();toast('🛒 أُضيف إلى السلة');
}
function renderCartBtn(){
  const b=$('cartBtn'),t=cartTotals(),show=t.count>0&&!(admin&&!preview);
  b.classList.toggle('hidden',!show);
  if(show)b.textContent=`🛒 مراجعة السلة (${t.count}) • ${fmt(t.total)} ${data.settings.currency}`;
}

function cartModal(){
  const cur=data.settings.currency;
  modal({title:'🛒 مراجعة طلبك',
    body:`<div id="cList"></div><div id="cTot" class="ctot"></div>
      <label>الاسم</label><input id="oName" maxlength="40">
      <label>نوع الطلب</label><select id="oType"><option value="pickup">🏪 الاستلام من الموقع</option><option value="delivery">🚗 توصيل</option></select>
      <div id="oDelNote" class="delnote hidden">🚗 تنبيه: سيتم إضافة رسوم توصيل على طلبك، وسيؤكد لك المطعم قيمتها عبر واتساب.</div>
      <label id="oPlaceL"></label><input id="oPlace" maxlength="120">
      <label>ملاحظات</label><textarea id="oNote" rows="2" maxlength="300"></textarea>
      <p class="note">راجع طلبك ثم اضغط تأكيد، وسيفتح واتساب برسالة الطلب جاهزة للإرسال للمطعم.</p>`,
    actions:[{label:'✅ تأكيد وإرسال عبر واتساب',cls:'green',fn:()=>sendOrder()},{label:'متابعة التسوق',cls:'ghost'}],
    onMount:()=>{
      const draw=()=>{
        const ls=cartLines();
        if(!ls.length){$('cList').innerHTML='<div class="empty" style="padding:20px">السلة فارغة</div>';$('cTot').innerHTML='';return}
        $('cList').innerHTML=ls.map(l=>`<div class="crow"><div class="cn"><b>${esc(l.it.name)}</b><small>${l.it.price!==''&&l.it.price!=null?esc(l.it.price)+' '+esc(cur):'بدون سعر'}</small></div>
          <div class="qty"><button data-q="-1" data-i="${l.it.id}">−</button><span>${l.q}</span><button data-q="1" data-i="${l.it.id}">+</button></div>
          <button class="btn red sm" data-rm="${l.it.id}">🗑️</button></div>`).join('');
        const t=cartTotals();
        $('cTot').innerHTML=`الإجمالي: <b>${fmt(t.total)} ${esc(cur)}</b>${t.noPrice?'<br><small>(لا يشمل الأصناف التي بدون سعر)</small>':''}`;
      };
      draw();
      const upd=()=>{
        const d=$('oType').value==='delivery';
        $('oDelNote').classList.toggle('hidden',!d);
        $('oPlaceL').textContent=d?'عنوان التوصيل *':'ملاحظة الاستلام (اختياري)';
        $('oPlace').placeholder=d?'الحي، الشارع، أقرب معلم':'';
      };
      $('oType').onchange=upd;upd();
      $('cList').onclick=ev=>{
        const b=ev.target.closest('button');if(!b)return;
        const c=cart.find(x=>x.id===(b.dataset.i||b.dataset.rm));if(!c)return;
        if(b.dataset.rm)cart=cart.filter(x=>x!==c);
        else{c.q+=+b.dataset.q;if(c.q<1)cart=cart.filter(x=>x!==c)}
        saveCart();draw();renderCartBtn();
      };
    }});
}
function sendOrder(){
  const ls=cartLines();if(!ls.length){toast('السلة فارغة',true);return false}
  const wa=normPhone(data.settings.whatsapp);if(!wa){alert('رقم واتساب المطعم غير مضبوط');return false}
  const cur=data.settings.currency,t=cartTotals();
  const name=$('oName').value.trim(),place=$('oPlace').value.trim(),note=$('oNote').value.trim();
  const del=$('oType').value==='delivery';if(del&&!place){alert('أدخل عنوان التوصيل');return false}
  let m=`🛒 *طلب جديد*${data.settings.name?' - '+data.settings.name:''}\n`;
  if(name)m+=`👤 الاسم: ${name}\n`;
  m+=`📦 نوع الطلب: ${del?'🚗 توصيل':'🏪 الاستلام من الموقع'}\n`;
  if(place)m+=`📍 ${del?'العنوان':'ملاحظة'}: ${place}\n`;
  m+=`\n*الطلبات:*\n`;
  ls.forEach((l,i)=>{const p=priceNum(l.it.price);m+=`${i+1}) ${l.it.name} × ${l.q}${p!=null?' = '+fmt(p*l.q)+' '+cur:''}\n`});
  m+=`\n💰 *الإجمالي: ${fmt(t.total)} ${cur}*${t.noPrice?' (لا يشمل الأصناف بدون سعر)':''}\n`;
  if(del)m+=`🚗 سيتم إضافة رسوم التوصيل على الإجمالي\n`;
  if(note)m+=`📝 ملاحظات: ${note}\n`;
  const url=`https://wa.me/${wa}?text=${encodeURIComponent(m)}`;
  const w=window.open(url,'_blank');if(!w)location.href=url;
  cart=[];saveCart();renderCartBtn();toast('تم تجهيز طلبك، أكمل الإرسال من واتساب ✅');
}

  {k:'special',n:'عرض خاص',e:'🎁',c:['#c2185b','#e64a19'],t:'عرض خاص',s:'خصم مميز على أصناف مختارة',b:'عرض خاص',discount:''},
  {k:'ram',n:'رمضان كريم',e:'🌙',c:['#0f2027','#2c5364'],t:'رمضان كريم',s:'أجواء رمضانية وعروض للإفطار والسحور',b:'رمضان',discount:''},
  {k:'eid',n:'عيد مبارك',e:'🕌',c:['#00695c','#00897b'],t:'عيد مبارك',s:'كل عام وأنتم بخير، عروض العيد وصلت',b:'عيد مبارك',discount:''},
  {k:'wk',n:'نهاية الأسبوع',e:'🏖️',c:['#0277bd','#00838f'],t:'عرض نهاية الأسبوع',s:'استمتع بعطلتك مع أطيب الأصناف',b:'الجمعة والسبت',discount:''},
  {k:'fri',n:'الجمعة البيضاء',e:'🏷️',c:['#212121','#455a64'],t:'الجمعة البيضاء',s:'أقوى الخصومات على المنيو بالكامل',b:'خصم كبير',discount:''},
  {k:'bday',n:'عيد ميلاد المطعم',e:'🎂',c:['#ad1457','#7b1fa2'],t:'عيد ميلادنا',s:'نحتفل معكم بعروض وهدايا لعملائنا',b:'احتفال',discount:''}
];

function bannerHtml(b,e){
  const t=EVENTS.find(x=>x.k===b.k)||EVENTS[0];
  return `<div class="evb" data-b="${esc(b.id||'')}" style="--c1:${t.c[0]};--c2:${t.c[1]}">
    <span class="fl f1">${t.e}</span><span class="fl f2">${t.e}</span><span class="fl f3">${t.e}</span><span class="fl f4">${t.e}</span>
    <div class="evt">
      ${b.badge?`<span class="evbadge">${esc(b.badge)}</span>`:''}
      ${b.discount?`<span class="evbadge disc">🔥 ${esc(b.discount)}</span>`:''}
      <h3>${t.e} ${esc(b.title)}</h3>
      ${b.sub?`<p>${esc(b.sub)}</p>`:''}
      ${b.date?`<small>📅 ${esc(b.date)}</small>`:''}
    </div>
    ${e?`<div class="evtools"><button data-be="${esc(b.id)}" title="تعديل">✏️</button><button data-bd="${esc(b.id)}" title="حذف">🗑️</button></div>`:''}
  </div>`;
}

function renderBanners(){
  const e=admin&&!preview,box=$('banners'),list=data.banners||[];
  if(!list.length&&!e){box.classList.add('hidden');box.innerHTML='';return}
  box.classList.remove('hidden');
  box.innerHTML=list.map(b=>bannerHtml(b,e)).join('')+(e?(list.length
    ?`<div class="tools"><button id="evAdd">➕ إضافة قالب مناسبة</button></div>`
    :`<button class="tpl" id="evAdd">🎉<br>مساحة قوالب المناسبات<small>الافتتاح، عرض حصري، اليوم الوطني وغيرها — اضغط لاختيار قالب جاهز</small></button>`):'');
  on('evAdd',eventGallery);
  box.querySelectorAll('[data-be]').forEach(b=>b.onclick=()=>bannerEdit(b.dataset.be));
  box.querySelectorAll('[data-bd]').forEach(b=>b.onclick=()=>{
    if(confirm('حذف هذا القالب؟')){data.banners=data.banners.filter(x=>x.id!==b.dataset.bd);save();renderBanners()}});
}

function eventGallery(){
  modal({title:'🎉 قوالب المناسبات',
    body:`<p class="note">اختر قالباً جاهزاً ثم عدّل نصوصه ونسبة الخصم كما تشاء.</p>
      <div class="evg">${EVENTS.map(t=>`<button class="evtile" data-k="${t.k}" style="--c1:${t.c[0]};--c2:${t.c[1]}"><span>${t.e}</span>${t.n}</button>`).join('')}</div>`,
    actions:[{label:'إغلاق',cls:'ghost'}],
    onMount:m=>m.querySelectorAll('.evtile').forEach(b=>b.onclick=()=>bannerEdit(null,b.dataset.k))});
}

function bannerEdit(id,k){
  data.banners=data.banners||[];
  const cur=id?data.banners.find(x=>x.id===id):null;
  const t0=EVENTS.find(x=>x.k===(cur?cur.k:k))||EVENTS[0];
  const b=cur?{...cur}:{id:'',k:t0.k,title:t0.t,sub:t0.s,badge:t0.b,discount:cur?.discount||'',date:''};
  modal({title:t0.e+' '+t0.n,
    body:`<div id="bPrev"></div>
      <label>العنوان *</label><input id="bT" maxlength="60" value="${esc(b.title)}">
      <label>نص فرعي</label><textarea id="bS" rows="2" maxlength="160">${esc(b.sub)}</textarea>
      <label>شارة قصيرة (مثل: عرض خاص)</label><input id="bB" maxlength="30" value="${esc(b.badge)}">
      <label>نسبة أو قيمة الخصم (اختياري)</label><input id="bDisc" maxlength="30" value="${esc(b.discount||'')}" placeholder="مثال: خصم 20% أو 50 ريال">
      <label>التاريخ أو المدة (اختياري)</label><input id="bD" maxlength="50" value="${esc(b.date)}" placeholder="من 1 إلى 5 ديسمبر">`,
    actions:[{label:'حفظ',cls:'green',fn:()=>{
      const title=$('bT').value.trim();if(!title){alert('أدخل عنوان القالب');return false}
      const o={title,sub:$('bS').value.trim(),badge:$('bB').value.trim(),discount:$('bDisc').value.trim(),date:$('bD').value.trim()};
      if(cur)Object.assign(cur,o);else data.banners.push({id:uid('b'),k:t0.k,...o});
      save();renderBanners();toast('تم الحفظ ✓');
    }},{label:'إلغاء',cls:'ghost'}],
    onMount:()=>{
      const pv=()=>{$('bPrev').innerHTML=bannerHtml({...b,title:$('bT').value||'…',sub:$('bS').value,badge:$('bB').value,discount:$('bDisc').value,date:$('bD').value},false)};
      ['bT','bS','bB','bDisc','bD'].forEach(i=>$(i).oninput=pv);pv();
    }});
}
 
/* ================= آراء العملاء المتحركة ================= */
function renderCmtTicker(){
  const box=$('cmtBox'),list=(data.comments||[]).slice(0,30);
  if(!list.length){box.classList.add('hidden');box.innerHTML='';return}
  box.classList.remove('hidden');
  box.innerHTML=`<h2>💬 آراء عملائنا</h2><div class="offers"><div class="track" id="ctrack"></div></div>`;
  const track=$('ctrack'),n=list.length;
  const cards=list.map((c,k)=>`<div class="ocard" style="--d:${(-(k/n)*OFFER_T).toFixed(2)}s"><div class="ccard"><div class="cq">❝</div><p>${esc(c.text)}</p><b>${esc(c.name||'زائر')}</b></div></div>`).join('');
  track.innerHTML=cards;
  const set=track.offsetWidth||1,vw=box.clientWidth||innerWidth;
  const reps=Math.max(1,Math.ceil(vw/set)),half=cards.repeat(reps);
  track.innerHTML=half+half;
  track.style.setProperty('--dist',(set*reps)+'px');
  track.style.setProperty('--dur',((set*reps)/45)+'s');
}
 
/* ================= التشغيل ================= */
(async()=>{
  const d=await dbGet();
  data=Object.assign(EMPTY(),d||{});
  data.settings=Object.assign(EMPTY().settings,(d&&d.settings||{}));
  if(sessionStorage.getItem('os_admin'))admin=true;
  renderAll();
  if(/admin/i.test(location.search+location.hash+location.pathname)&&!admin)openLogin();
})();
</script>
